apiVersion: v1
kind: ConfigMap
metadata:
  name: engine-config
data:
  STREAM_KEY: "codesaga:events:code"
  CONSUMER_GROUP: "india-1"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: codesaga-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codesaga-engine
  template:
    metadata:
      labels:
        app: codesaga-engine
    spec:
      containers:
      - name: engine
        image: jamesnagar/codesaga-engine:82419ea63a892a38e41252154962d0d205372e0b
        envFrom:
        - configMapRef:
            name: engine-config
        - secretRef:
            name: engine-secrets
        resources:
          limits:
            cpu: "900m"
          requests:
            cpu: "300m"
