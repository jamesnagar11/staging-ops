    name: codesaga-bulk-executor

  minReplicaCount: 1
  maxReplicaCount: 10

  pollingInterval: 11
  cooldownPeriod: 20

  triggers:
    - type: redis-streams
      metadata:
        address: valkey-1a6340eb-princenagarjamescoc-04cb.i.aivencloud.com:21031
        stream: "codesaga:events:db"
        consumerGroup: "india-1"
        lagCount: "200"
        activationLagCount: "0"

      authenticationRef:
        name: redis-keda-auth