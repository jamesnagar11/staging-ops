apiVersion: v1
kind: Secret
metadata:
  name: redis-keda-auth
  namespace: default
type: Opaque
data:
  redis-username: "ZGVmYXVsdA=="
  redis-password: "QVZOU19ib1JVTXM4cHhVVE5hMTFjOHM1"

---

apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: redis-keda-auth
  namespace: default

spec:
